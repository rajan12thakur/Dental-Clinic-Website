
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional dental care for healthy, confident smiles.">

    <title>{% block title %}Everbright Dental | Your Smile Matters{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'dental_website/css/site.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "includes/navbar.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <script src="{% static 'dental_website/js/site.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
